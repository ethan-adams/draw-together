# Two interchangeable gateway nodes behind one load balancer, sharing boards
# through Redis and persisting them to Postgres. Open http://localhost:8080 in
# two windows: the load balancer round-robins them onto different nodes (watch
# the node label in the corner), yet they draw on the same board. Refresh, or
# join late on the other node, and the drawing is still there.
#
#   docker compose up --build
#
# Prefer to pin a window to a specific node? Hit http://localhost:8081 (gw1) or
# http://localhost:8082 (gw2) directly.
name: draw

x-gateway-env: &gateway-env
  REDIS_ADDR: redis:6379
  POSTGRES_DSN: postgres://draw:draw@postgres:5432/draw?sslmode=disable

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: draw
      POSTGRES_PASSWORD: draw
      POSTGRES_DB: draw
    # Not published to the host. The gateways reach it over the compose network.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U draw -d draw"]
      interval: 3s
      timeout: 3s
      retries: 10

  gw1:
    build: .
    environment:
      <<: *gateway-env
      NODE_NAME: gw1
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
    ports:
      - "8081:8080"

  gw2:
    build: .
    environment:
      <<: *gateway-env
      NODE_NAME: gw2
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
    ports:
      - "8082:8080"

  lb:
    image: caddy:2-alpine
    ports:
      - "8080:8080"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - gw1
      - gw2
