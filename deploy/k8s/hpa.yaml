# Autoscale the gateway on CPU. Requires metrics-server in the cluster
# (`make metrics-server`). Optional for the load test — fixed replicas work
# fine — but it demonstrates the payoff of stateless nodes: scaling is just
# "add replicas," no coordination.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: draw-gateway
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: draw-gateway
  minReplicas: 3
  maxReplicas: 12
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
