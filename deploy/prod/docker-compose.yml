# Production single-box deploy: the full Draw stack behind Caddy with
# automatic HTTPS. Runs anywhere Docker runs — a small VPS, a spare Linux box,
# a Raspberry Pi. Two interchangeable gateway nodes share boards through Redis
# and persist them to Postgres, exactly like the local scale demo, so a live
# site proves cross-node fan-out for real.
#
#   cp .env.example .env      # set DRAW_DOMAIN + a Postgres password
#   docker compose --env-file .env up -d --build
#
# Caddy fetches a Let's Encrypt certificate for DRAW_DOMAIN automatically;
# point that domain's DNS (an A record) at this host's public IP first.
name: draw-prod

x-gateway-env: &gateway-env
  REDIS_ADDR: redis:6379
  POSTGRES_DSN: postgres://draw:${POSTGRES_PASSWORD}@postgres:5432/draw?sslmode=disable

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: draw
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: draw
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U draw -d draw"]
      interval: 5s
      timeout: 3s
      retries: 10

  gw1:
    build:
      context: ../..
    restart: unless-stopped
    environment:
      <<: *gateway-env
      NODE_NAME: gw1
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy

  gw2:
    build:
      context: ../..
    restart: unless-stopped
    environment:
      <<: *gateway-env
      NODE_NAME: gw2
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DRAW_DOMAIN: ${DRAW_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - gw1
      - gw2

volumes:
  pgdata:
  caddy_data:
  caddy_config:
